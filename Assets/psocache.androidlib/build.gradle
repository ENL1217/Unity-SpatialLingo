apply plugin: 'com.android.library'

android {
    namespace "com.meta.psocache"
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            assets.srcDirs = ['assets']
            java.srcDirs = ['src']
        }
    }

    buildToolsVersion providers.gradleProperty("unity.buildToolsVersion").get()
    compileSdk providers.gradleProperty("unity.compileSdkVersion").get().toInteger()
    defaultConfig {
        targetSdk providers.gradleProperty("unity.targetSdkVersion").get().toInteger()
        minSdk providers.gradleProperty("unity.minSdkVersion").get().toInteger()
    }
}
